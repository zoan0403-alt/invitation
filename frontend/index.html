<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Générateur de Billet</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Générateur d'Invitation</h1>

    <input
            type="text"
            id="nom"
            placeholder="Nom de l'invité"
    >

    <button onclick="genererBillet()">
        Générer le billet
    </button>

    <div class="preview-container">
        <img id="preview">
    </div>

    <a
            id="download"
            download="invitation.png"
    >
        Télécharger
    </a>

</div>

<script src="script.js"></script>

</body>
</html>
